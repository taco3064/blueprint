name: Migrate 434 tests

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feat/434-module-first-topology-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-434-tests.mjs
      - name: Lint migrated tests
        shell: bash
        run: |
          npx eslint src --fix && exit 0
          for file in \
            src/emit/agent/sections.test.ts \
            src/emit/docs/sections.test.ts \
            src/emit/lint/lint.gates.test.ts \
            src/emit/lint/lint.plugins.test.ts \
            src/emit/lint/lint.test.ts; do
            echo "### $file"
            nl -ba "$file" | sed -n '1,330p' | awk '$1 == 14 || $1 == 16 || $1 == 20 || $1 == 22 || $1 == 252 || $1 == 284 { print }'
          done
          exit 1
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          HUSKY=0 git commit -m "test: migrate fixtures to Blueprint 4.0 unit shape"
          HUSKY=0 git push origin HEAD:${{ github.head_ref }}
