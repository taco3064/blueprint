name: patch-434-quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch-434-quality.mjs'
      - '.github/workflows/patch-434-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/434-module-first-topology-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-434-quality.mjs
      - name: Auto-fix touched source formatting
        run: npx eslint src/config/defineBlueprint.ts src/config/resolved.ts src/emit/lint/lint.ts src/plugin/relative-escape.ts --fix || true
      - name: Commit quality refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/defineBlueprint.ts src/config/resolved.ts src/emit/lint/lint.ts src/plugin/relative-escape.ts
          if git diff --cached --quiet; then exit 0; fi
          HUSKY=0 git commit -m 'refactor: bound #434 topology quality gates'
          HUSKY=0 git push origin HEAD:${{ github.head_ref }}
