name: Mutation

# Manual only, on purpose. A mutation score cannot be a gate here: Stryker has no
# approved-survivor ledger, so a threshold would be a hard-coded number that
# every `src/` edit invalidates — and this repo argues against a red nobody can
# appease (see the wiring check's own skip reasons). Coverage thresholds already
# fail a PR that adds untested code; this answers the different question of
# whether the assertions would catch a WRONG line, and that answer is worth
# reading rather than enforcing.
#
# Same division of labour as `npm run field:run`: conformance guards the known
# scenarios in CI, the manual harness hunts for new ones.
#
# How to run it — the ref is the whole point, so it is typed rather than inferred:
#
#   gh workflow run mutation.yml --ref <branch>                          # whole tree
#   gh workflow run mutation.yml --ref <branch> -f mutate='src/x/y.ts'   # one file
#
# There is deliberately no `npm run` shortcut. `gh` is not on this repo's script
# surface (every entry in `scripts` is node or a devDependency binary), and the
# one argument a shortcut would guess is `--ref` — which, in a repo whose work
# happens in worktrees, is how you measure a tree you did not mean to and then
# file the number as authoritative.
on:
  workflow_dispatch:
    inputs:
      # `.claude/docs/mutation-testing.md` prescribes two different runs: one file
      # while you work on it, the whole tree before you believe the number. Without
      # this input, checking a single file costs a full sweep — the wrong price for
      # the loop that runs most often.
      mutate:
        description: 'Globs to narrow the sweep, comma-separated. Blank sweeps the whole tree.'
        required: false
        type: string

jobs:
  mutation:
    name: Mutation survey
    runs-on: ubuntu-latest
    # Measured here rather than inferred from a laptop: ~8k mutants, 17m04s on this
    # runner, against 5m34s on ten local cores. The cap is ~2.6x that, which leaves
    # room for the tree to grow and still stops a hung run from burning the default
    # six-hour budget. Re-measure it when the mutant count moves materially; a cap
    # sized against a number nobody has re-taken is the thing this comment replaced.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--mutate` REPLACES the config's `mutate` array rather than intersecting
      # with it, so narrowing to `src/inspect/*.ts` would also hand Stryker the
      # `.test.ts` files sitting beside them. The config calls that exclusion the
      # one that is not a judgement call — mutating an assertion and then asking
      # the same assertion whether it noticed is circular — so the negation is
      # re-appended here instead of being left to whoever fills in the box.
      #
      # The glob travels as an env var, not interpolated into the command line, so
      # a `!` or a `*` in it reaches Stryker as an argument rather than something
      # the shell expands first.
      - name: Run Stryker
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then
            npx stryker run --mutate "$MUTATE,!**/*.test.ts"
          else
            npx stryker run
          fi

      # The log carries the score and the artifact carries the detail, but neither
      # answers "which mutants survived" in the place you are already looking. This
      # does — and it names the scope, because a narrowed run flatters: the same
      # mutant reads killed under one file and survived in a whole tree, and a
      # partial sweep must not be filed as the authority.
      #
      # Single-quoted for the shell on purpose: a double-quoted `node -e` body
      # hands its backticks and `${}` to the shell instead of to node.
      - name: Summarise the survivors
        if: always()
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          node -e '
            const { existsSync, readFileSync, appendFileSync } = require("node:fs");
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const report = "reports/mutation/mutation.json";

            if (!existsSync(report)) {
              appendFileSync(summary, "No report: the run did not get far enough to write one.\n");
              process.exit(0);
            }

            const { files } = JSON.parse(readFileSync(report, "utf8"));
            const survivors = (f) => f.mutants.filter((m) => m.status === "Survived");
            const groups = Object.entries(files)
              .map(([file, f]) => [file, survivors(f)])
              .filter(([, mutants]) => mutants.length > 0)
              .sort((a, b) => b[1].length - a[1].length);

            const total = groups.reduce((n, [, mutants]) => n + mutants.length, 0);
            const nocov = Object.values(files)
              .reduce((n, f) => n + f.mutants.filter((m) => m.status === "NoCoverage").length, 0);
            const count = (n, word) => n + " " + word + (n === 1 ? "" : "s");

            const out = [
              "## " + count(total, "survivor") + " — scope: " + (process.env.MUTATE || "the whole tree"),
              "",
              // Only when there are any: "0 further mutants had no coverage" spends four
              // lines explaining a category the run did not produce.
              ...(nocov > 0 ? [
                count(nocov, "further mutant") + " had no coverage. Those sit in the `/* v8 ignore */`",
                "real-I/O defaults the tests inject instead of running — the same boundary",
                "vitest draws, and nothing to chase.",
                "",
              ] : []),
              "A survivor is a question, not a defect: the line ran, and nothing asserted",
              "its result. Judge each one before writing a test — and match this list",
              "against `grep -rni undecidable src/ test/ --include=*.ts` first, which is where",
              "most of them are already answered. See `.claude/docs/mutation-testing.md`.",
              "",
            ];

            for (const [file, mutants] of groups) {
              out.push("### " + file + " — " + mutants.length);
              for (const m of mutants) out.push("- L" + m.location.start.line + " " + m.mutatorName);
              out.push("");
            }

            appendFileSync(summary, out.join("\n") + "\n");
          '

      # The score is in the log above; the report is how you read WHICH mutants
      # survived — the only part that is actionable. Uploaded even on failure,
      # because a run that dies partway still names what it got through.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
