name: Mutation smoke

# Deliberately manual. Deliver agents run this against the PR base before opening
# the PR and archive the file-backed report. The workflow is a stable-executor
# fallback, not an automatic consumer of Actions minutes.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Git ref to compare with the selected branch.'
        required: true
        default: main
        type: string
      max_changed_lines:
        description: 'Refuse an unexpectedly broad mutation surface.'
        required: true
        default: '200'
        type: string

jobs:
  mutation-smoke:
    name: Changed-code mutation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation smoke
        env:
          BASE: ${{ inputs.base }}
          MAX_CHANGED_LINES: ${{ inputs.max_changed_lines }}
        run: |
          npm run mutation:smoke -- \
            --base "$BASE" \
            --max-changed-lines "$MAX_CHANGED_LINES"

      - name: Publish file-backed summary
        if: always()
        shell: bash
        run: |
          if [ -s reports/mutation-smoke/summary.json ]; then
            {
              echo '## Changed-code mutation smoke'
              echo '```json'
              cat reports/mutation-smoke/summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mutation smoke stopped before writing a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-smoke-report
          path: reports/mutation-smoke/
          retention-days: 14
          if-no-files-found: warn
