name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Mergeability preflight
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      base_head_sha: ${{ steps.inspect.outputs.base_head_sha }}
      merge_base_sha: ${{ steps.inspect.outputs.merge_base_sha }}
      integration_tree_sha: ${{ steps.inspect.outputs.integration_tree_sha }}
      candidate_sha: ${{ steps.inspect.outputs.candidate_sha }}
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Establish integration candidate
        id: inspect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node scripts/ci-preflight.mjs \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --candidate "$CANDIDATE_SHA" \
            --output reports/ci/preflight.json

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-preflight-${{ github.run_id }}
          path: reports/ci/preflight.json
          retention-days: 30
          if-no-files-found: error

  ci:
    name: ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_TREE: ${{ needs.preflight.outputs.integration_tree_sha }}
        run: test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run tsc

      - name: Run tests
        run: npm test

      - name: Build the package
        run: npm run build

      - name: Verify the built artifact
        run: npm run dist:verify

  engines-floor:
    name: node 18 (declared engines floor)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: '18.18.0'
      - run: node scripts/dist-verify.mjs

  eslint-10:
    name: eslint 10 (the major init resolves to)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm i -D eslint@10 --no-save
      - run: node -e 'const v = require("eslint/package.json").version; if (!v.startsWith("10.")) process.exit(1)'
      - run: npm test

  operational:
    name: Operational contract proof
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run operational:check

  documentation:
    name: Documentation proof
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check

  transformation:
    name: Deterministic topology replay
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Run deterministic topology replay
        run: npm run field:transformation > transformation.log 2>&1
      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transformation-${{ github.run_id }}
          path: transformation.log
          retention-days: 30
          if-no-files-found: error

  mutation-plan:
    name: Mutation scope plan
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch formal review checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" > reviews.json
          REVIEWED="$(node --input-type=module -e "import { latestReviewedSha } from './scripts/mutation-ci.mjs'; import fs from 'node:fs'; process.stdout.write(latestReviewedSha(JSON.parse(fs.readFileSync('reviews.json', 'utf8'))) ?? '')")"
          if [ -n "$REVIEWED" ]; then
            gh api "repos/${{ github.repository }}/commits/$REVIEWED/check-runs" > checkpoints.json
          else
            echo '{"check_runs":[]}' > checkpoints.json
          fi
      - name: Fetch newest reusable mutation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs?event=pull_request&per_page=100" > mutation-runs.json
          node --input-type=module <<'NODE' > mutation-run-ids.txt
          import fs from 'node:fs';
          const payloads = JSON.parse(fs.readFileSync('mutation-runs.json', 'utf8'));
          const runs = (Array.isArray(payloads) ? payloads : [payloads]).flatMap((page) => page.workflow_runs ?? []);
          const candidates = runs
            .filter((run) => String(run.id) !== process.env.CURRENT_RUN_ID)
            .filter((run) => run.pull_requests?.some((pull) => String(pull.number) === process.env.PR_NUMBER))
            .sort((left, right) => String(right.created_at).localeCompare(String(left.created_at)));
          process.stdout.write(candidates.map((run) => `${run.id} ${run.head_sha}`).join('\n'));
          NODE
          mkdir -p reports/mutation-previous
          while read -r RUN_ID RUN_HEAD; do
            git cat-file -e "$RUN_HEAD^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$RUN_HEAD" "$HEAD_SHA" || continue
            gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" > mutation-artifacts.json
            AGGREGATE_ID="$(node --input-type=module -e "import fs from 'node:fs'; const pages=JSON.parse(fs.readFileSync('mutation-artifacts.json','utf8')); const artifacts=pages.flatMap((page)=>page.artifacts??[]); process.stdout.write(String(artifacts.find((item)=>item.name==='mutation-aggregate-$RUN_ID'&&!item.expired)?.id??''))")"
            if [ -n "$AGGREGATE_ID" ]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/$AGGREGATE_ID/zip" > mutation-evidence.zip
              unzip -q mutation-evidence.zip -d reports/mutation-previous
              break
            fi
            PLAN_ID="$(node --input-type=module -e "import fs from 'node:fs'; const pages=JSON.parse(fs.readFileSync('mutation-artifacts.json','utf8')); const artifacts=pages.flatMap((page)=>page.artifacts??[]); process.stdout.write(String(artifacts.find((item)=>item.name==='mutation-plan-$RUN_ID'&&!item.expired)?.id??''))")"
            [ -n "$PLAN_ID" ] || continue
            gh api "repos/${{ github.repository }}/actions/artifacts/$PLAN_ID/zip" > mutation-plan.zip
            unzip -q mutation-plan.zip -d reports/mutation-previous
            RUN_ID="$RUN_ID" node --input-type=module -e '
              import fs from "node:fs";
              const pages = JSON.parse(fs.readFileSync("mutation-artifacts.json", "utf8"));
              const suffix = "-" + process.env.RUN_ID;
              const artifacts = pages.flatMap((page) => page.artifacts ?? [])
                .filter((item) => item.name.startsWith("mutation-shard-") && item.name.endsWith(suffix))
                .filter((item) => !item.expired);
              process.stdout.write(artifacts.map((item) => item.id + " " + item.name).join("\n"));
            ' > mutation-shard-artifacts.txt
            while read -r SHARD_ARTIFACT_ID SHARD_ARTIFACT_NAME; do
              mkdir -p "reports/mutation-previous/downloaded/$SHARD_ARTIFACT_NAME"
              gh api "repos/${{ github.repository }}/actions/artifacts/$SHARD_ARTIFACT_ID/zip" > mutation-shard.zip
              unzip -q mutation-shard.zip -d "reports/mutation-previous/downloaded/$SHARD_ARTIFACT_NAME"
            done < mutation-shard-artifacts.txt
            break
          done < mutation-run-ids.txt
      - name: Plan complete changed-production scope
        id: plan
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_head_sha }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          MATRIX="$(node scripts/mutation-ci.mjs plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --reviews reviews.json \
            --checkpoints checkpoints.json \
            --previous reports/mutation-previous \
            --target-lines 100 \
            --output reports/mutation-ci/manifest.json)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-plan-${{ github.run_id }}
          path: reports/mutation-ci/manifest.json
          retention-days: 30
          if-no-files-found: error

  mutation-shard:
    name: Mutation shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    needs: [preflight, mutation-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: mutation-plan-${{ github.run_id }}
          path: reports/mutation-ci
      - name: Run shard
        run: |
          node scripts/mutation-ci.mjs run-shard \
            --manifest reports/mutation-ci/manifest.json \
            --shard "${{ matrix.shard }}" \
            --output "reports/mutation-ci/shard-${{ matrix.shard }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/mutation-ci/shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: error

  mutation-aggregate:
    name: Mutation aggregate
    if: always() && github.event_name == 'pull_request' && needs.mutation-plan.result == 'success'
    needs: [preflight, mutation-plan, mutation-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: mutation-plan-${{ github.run_id }}
          path: reports/mutation-ci
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*-${{ github.run_id }}
          path: reports/mutation-ci/downloaded
      - name: Aggregate exact scope
        id: aggregate
        continue-on-error: true
        run: |
          node scripts/mutation-ci.mjs aggregate \
            --manifest reports/mutation-ci/manifest.json \
            --shards reports/mutation-ci/downloaded \
            --output reports/mutation-ci/aggregate.json \
            --markdown reports/mutation-ci/summary.md
      - name: Publish actionable summary
        if: always()
        run: cat reports/mutation-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-aggregate-${{ github.run_id }}
          path: reports/mutation-ci
          retention-days: 30
          if-no-files-found: error
      - name: Enforce mutation result
        if: steps.aggregate.outcome != 'success'
        run: exit 1

  pr-gate:
    name: PR verification
    if: always() && github.event_name == 'pull_request'
    needs: [preflight, ci, engines-floor, eslint-10, operational, documentation, transformation, mutation-aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification branch
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs).filter(([, value]) => value.result !== "success");
            if (failed.length) {
              console.error(failed.map(([name, value]) => `${name}: ${value.result}`).join("\n"));
              process.exit(1);
            }
          '

  candidate:
    name: Pack exact main candidate
    if: always() && github.event_name == 'push'
    needs: [preflight, ci, engines-floor, eslint-10, operational, documentation, transformation]
    runs-on: ubuntu-latest
    steps:
      - name: Require deterministic main gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            if (Object.values(needs).some((value) => value.result !== "success")) process.exit(1);
          '
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run dist:verify
      - name: Pack candidate and manifest
        env:
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: node scripts/field-candidate.mjs pack --output candidate --head "$HEAD_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-candidate-${{ needs.preflight.outputs.head_sha }}
          path: candidate
          retention-days: 30
          if-no-files-found: error
