name: CI

on:
  pull_request:
    branches:
      - main
  # main takes commits directly, so PR-only CI left it unverified on Linux
  # until release time — where a macOS-only case-insensitive filename match
  # failed the publish job instead of a test run.
  push:
    branches:
      - main

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both legs report, so one platform's failure does not hide the other's.
      fail-fast: false
      matrix:
        # This tool reads and writes other people's repositories, and it carries
        # explicit Windows branches to do it: `scan`, `ignored` and `impact` all
        # normalise with `.split(path.sep).join('/')`, and the relative-escape rule
        # splits on `[\\/]`. On posix `path.sep` IS `/`, so those branches are
        # no-ops here and their Windows behaviour had never been observed. The
        # note above about a macOS-only filename match is the same lesson from the
        # other direction.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run tsc

      - name: Run tests
        run: npm run test

      # The package entry is `dist/`, and nothing before this step touches it:
      # lint and tsc read `src/`, and the tests import from `src/` too. So a
      # broken rolldown config or a `.d.ts` that will not emit used to surface in
      # release.yml — after the tag, on the job that publishes.
      - name: Build the package
        run: npm run build

      # The suite drives the CLI in-process (`import { run } from '../cli'`), so
      # the bundle, the shebang, the package entry points and the argv[1] guard
      # were checked only by `field:run` and by hand. That guard is the 0.1.1
      # bug: npm installs the bin as a symlink, and comparing argv[1] to the
      # entry module without realpathSync makes the published CLI exit 0 having
      # done nothing.
      - name: Verify the built artifact
        run: npm run dist:verify

  # `engines` declares ^18.18.0 as the oldest Node an adopter may be on. The
  # matrix above runs the .nvmrc version, so that floor was a claim read off the
  # source — every Node API in `src/` predates 18 — rather than something a run
  # had ever executed. Same "documented but never measured" shape this repo has
  # been closing elsewhere, so it gets measured.
  #
  # The devDependencies cannot install on 18 (vitest needs ^20 || >=22), and they
  # do not need to: what `engines` constrains is the ADOPTER's runtime. So the
  # check is the built artifact on the floor — build on the current Node, then
  # execute `dist/bin.js` and import the package entry on 18.18.0 exactly, not
  # 18.x, because the floor is the version being claimed.
  engines-floor:
    name: node 18 (declared engines floor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node for the build
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Switch to the declared floor
        uses: actions/setup-node@v7
        with:
          node-version: '18.18.0'

      # Called directly rather than through `npm run`, so what runs the artifact
      # is the floor's own node and nothing else is in the way.
      - name: Run the artifact on it
        run: node scripts/dist-verify.mjs

  # `init` installs `eslint` unpinned, so an adopter resolves the newest major in
  # `SUPPORTED_ESLINT_MAJORS` — a field run measured `^10.8.0` landing in the
  # project's `package.json`. This repo's own devDependency is `^9.39.2`, so
  # before this leg every suite and every job above ran 9, and the one version
  # the tool actually hands people was the one version never executed. Same
  # "declared but never measured" shape as the engines floor above, which is why
  # it sits beside it.
  #
  # `npm run lint` is deliberately absent, and the reason is SCOPE — not that it
  # would fail. What this leg promises is that the config blueprint EMITS loads
  # under 10 and its rules survive there, and that is `npm test`: the conformance
  # suite and `impact` both resolve a real config with a real ESLint. Whether THIS
  # repo's own config is clean on a new major is a different question, and asking
  # it here would tie the leg to the `@eslint/js` (`^9`) and
  # `@stylistic/eslint-plugin` (`^5`) majors — a bump in either would then redden
  # a job that says nothing about them. `build` and `dist:verify` never read
  # eslint at all, so the legs above already cover them for 10.
  #
  # An earlier draft of this comment said that run was already red. It is not:
  # `eslint .` under 10.8.0 passes this tree today. The claim came from the issue
  # text and was never measured — which is precisely the failure class this leg
  # exists to end, reproduced in the file adding it. Scope is the reason; a red
  # that nobody had observed was never one.
  eslint-10:
    name: eslint 10 (the major init resolves to)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--no-save` because what this leg swaps is the resolved tree, not the
      # declared dependency: development stays on 9, and `package.json` staying
      # put is what keeps the `npm ci` above reproducible. No `--legacy-peer-deps`
      # is needed — every carrier's peer range admits 10, which `detect.test.ts`
      # asserts off the installed manifests rather than from a list written here.
      - name: Swap in the major an adopter gets
        run: npm i -D eslint@10 --no-save

      # A leg that silently ran 9 would be worse than no leg: it would report as
      # coverage of a version nothing had executed, which is the failure this job
      # exists to end. So the swap is asserted rather than assumed.
      # Single-quoted for the shell on purpose: a double-quoted `node -e` body
      # hands its backticks and `${}` to the shell instead of to node.
      - name: Confirm the swap took
        run: |
          node -e 'const v = require("eslint/package.json").version; if (!v.startsWith("10.")) { console.error("expected eslint 10, resolved " + v); process.exit(1); } console.log("eslint " + v);'

      - name: Run tests
        run: npm run test
