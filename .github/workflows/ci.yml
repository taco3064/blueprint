name: CI

on:
  pull_request:
    branches:
      - main
  # main takes commits directly, so PR-only CI left it unverified on Linux
  # until release time — where a macOS-only case-insensitive filename match
  # failed the publish job instead of a test run.
  push:
    branches:
      - main

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both legs report, so one platform's failure does not hide the other's.
      fail-fast: false
      matrix:
        # This tool reads and writes other people's repositories, and it carries
        # explicit Windows branches to do it: `scan`, `ignored` and `impact` all
        # normalise with `.split(path.sep).join('/')`, and the relative-escape rule
        # splits on `[\\/]`. On posix `path.sep` IS `/`, so those branches are
        # no-ops here and their Windows behaviour had never been observed. The
        # note above about a macOS-only filename match is the same lesson from the
        # other direction.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run tsc

      - name: Run tests
        run: npm run test

      # The package entry is `dist/`, and nothing before this step touches it:
      # lint and tsc read `src/`, and the tests import from `src/` too. So a
      # broken rolldown config or a `.d.ts` that will not emit used to surface in
      # release.yml — after the tag, on the job that publishes.
      - name: Build the package
        run: npm run build

      # The suite drives the CLI in-process (`import { run } from '../cli'`), so
      # the bundle, the shebang, the package entry points and the argv[1] guard
      # were checked only by `field:run` and by hand. That guard is the 0.1.1
      # bug: npm installs the bin as a symlink, and comparing argv[1] to the
      # entry module without realpathSync makes the published CLI exit 0 having
      # done nothing.
      - name: Verify the built artifact
        run: npm run dist:verify
