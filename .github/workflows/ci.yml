name: CI

on:
  pull_request:
    branches:
      - main
  # main takes commits directly, so PR-only CI left it unverified on Linux
  # until release time — where a macOS-only case-insensitive filename match
  # failed the publish job instead of a test run.
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint / Type Check / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run tsc

      - name: Run tests
        run: npm run test
