name: Publish 4.0.0 one-shot

on:
  push:
    branches:
      - release/v4.0.0-publish

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 3b2acf8d6db9d1d0a81e39132d2a73d617bd1812
      TAG_NAME: v4.0.0
      TAG_VERSION: 4.0.0

    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v7
        with:
          ref: 3b2acf8d6db9d1d0a81e39132d2a73d617bd1812
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built artifact
        run: npm run dist:verify

      - name: Validate Changesets release SHA
        run: node scripts/release-changeset-gate.mjs

      - name: Refuse duplicate npm publish
        shell: bash
        run: |
          if npm view "@kekkai/blueprint@$TAG_VERSION" version >/dev/null 2>&1; then
            echo "@kekkai/blueprint@$TAG_VERSION already exists on npm"
            exit 1
          fi

      - name: Move release tag to exact main SHA
        shell: bash
        run: |
          git tag -f "$TAG_NAME" "$TARGET_SHA"
          git push --force origin "refs/tags/$TAG_NAME"

      - name: Configure npm publishing
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog-section.mjs "$TAG_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
