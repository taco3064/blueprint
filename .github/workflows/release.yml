name: Release (tag)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full main SHA that passed the complete field matrix
        required: true
        type: string
      candidate_run_id:
        description: Successful CI run that packed this exact candidate
        required: true
        type: string
      tag:
        description: Stable release tag matching the candidate version
        required: true
        type: string
      publish:
        description: Publish the verified original tarball and create its tag/release
        default: false
        type: boolean

permissions:
  # write: the publish step also cuts the GitHub Release for this tag
  contents: write
  id-token: write
  # read: the field gate follows the exact tag commit's status to its ticket comment
  statuses: read
  issues: read
  actions: read

concurrency:
  group: blueprint-release-publication
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Verify original CI artifact and candidate release gates
        run: node scripts/release-recovery.mjs prepare

      - name: Check original tarball publication without publishing
        run: |
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/blueprint-release-recovery/recovery.json")).tarball')
          npm publish "$TARBALL" --dry-run --ignore-scripts

      - name: Install provenance signer outside the candidate
        if: inputs.publish
        run: npm install --prefix "$RUNNER_TEMP/provenance-tools" --ignore-scripts --no-audit --no-fund sigstore@4.1.1

      - name: Sign candidate and publisher provenance
        if: inputs.publish
        run: |
          export SIGSTORE_MODULE="$RUNNER_TEMP/provenance-tools/node_modules/sigstore/dist/index.js"
          node scripts/release-recovery-provenance.mjs "$RUNNER_TEMP/blueprint-release-recovery/recovery.json" "$RUNNER_TEMP/blueprint-release-recovery/provenance.json"

      - uses: actions/setup-node@v7
        if: inputs.publish
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Reverify and publish the original candidate
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release-recovery.mjs verify
          SHA=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/blueprint-release-recovery/recovery.json")).manifest.headSha')
          TAG=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/blueprint-release-recovery/recovery.json")).tag')
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/blueprint-release-recovery/recovery.json")).tarball')
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          fi
          node scripts/release-recovery.mjs verify
          npm publish "$TARBALL" --ignore-scripts --access public --provenance-file "$RUNNER_TEMP/blueprint-release-recovery/provenance.json"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/blueprint-release-recovery/release-notes.md"
          fi

      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/blueprint-release-recovery/recovery.json
            ${{ runner.temp }}/blueprint-release-recovery/release-notes.md
            ${{ runner.temp }}/blueprint-release-recovery/provenance.json

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release validation locates the Changesets version commit in history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run tsc

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built artifact
        run: npm run dist:verify

      # -------------------------
      # 🚧 Release Safety Gates
      # -------------------------

      - name: Ensure tag version matches package.json version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="$(echo "$TAG_NAME" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          if [ -z "$TAG_VERSION" ]; then
            echo "❌ Cannot parse semver (x.y.z) from tag: $TAG_NAME"
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "✅ Tag version matches Changesets-generated package version: $TAG_VERSION"

      - name: Validate Changesets release SHA
        run: node scripts/release-changeset-gate.mjs

      - name: Require exact-SHA full field convergence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-field-gate.mjs

      # -------------------------
      # 🚀 Publish
      # -------------------------

      # Keep npm registry auth out of build and consumer verification. setup-node
      # writes an npmrc containing ${NODE_AUTH_TOKEN}; Yarn 1 eagerly expands that
      # file and fails before install when the token is intentionally absent.
      - name: Configure npm publishing
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -------------------------
      # 📣 Announce
      # -------------------------

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="$(echo "$TAG_NAME" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "↷ release exists: $TAG_NAME — left as written; delete it to regenerate from CHANGELOG.md"
            exit 0
          fi

          node scripts/changelog-section.mjs "$TAG_VERSION" > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG_NAME" \
            --title "v$TAG_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

          echo "✓ release: v$TAG_VERSION (notes from CHANGELOG.md § $TAG_VERSION)"
