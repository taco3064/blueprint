name: Release (tag)

on:
  push:
    tags:
      - '*'

permissions:
  # write: the publish step also cuts the GitHub Release for this tag
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release validation locates the Changesets version commit in history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the built artifact
        run: npm run dist:verify

      # -------------------------
      # 🚧 Release Safety Gates
      # -------------------------

      - name: Ensure tag version matches package.json version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="$(echo "$TAG_NAME" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          if [ -z "$TAG_VERSION" ]; then
            echo "❌ Cannot parse semver (x.y.z) from tag: $TAG_NAME"
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "✅ Tag version matches Changesets-generated package version: $TAG_VERSION"

      - name: Validate Changesets release SHA
        run: node scripts/release-field-gate.mjs

      # -------------------------
      # 🚀 Publish
      # -------------------------

      # Keep npm registry auth out of build and consumer verification. setup-node
      # writes an npmrc containing ${NODE_AUTH_TOKEN}; Yarn 1 eagerly expands that
      # file and fails before install when the token is intentionally absent.
      - name: Configure npm publishing
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -------------------------
      # 📣 Announce
      # -------------------------

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="$(echo "$TAG_NAME" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "↷ release exists: $TAG_NAME — left as written; delete it to regenerate from CHANGELOG.md"
            exit 0
          fi

          node scripts/changelog-section.mjs "$TAG_VERSION" > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG_NAME" \
            --title "v$TAG_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

          echo "✓ release: v$TAG_VERSION (notes from CHANGELOG.md § $TAG_VERSION)"
