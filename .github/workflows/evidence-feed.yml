name: Evidence feed

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/evidence-feed/**'
      - '.github/workflows/evidence-feed.yml'
  push:
    branches: [main]
    paths:
      - 'workers/evidence-feed/**'
      - '.github/workflows/evidence-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-feed-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: workers/evidence-feed

jobs:
  bundle:
    name: Worker bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: workers/evidence-feed/package-lock.json
      - run: npm ci
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy and verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: evidence-feed
      url: ${{ steps.deploy.outputs.url && format('{0}/discussions', steps.deploy.outputs.url) || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (workers/evidence-feed/README.md, Activation), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: workers/evidence-feed/package-lock.json
      - run: npm ci
      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -m 1 -oE 'https://blueprint-evidence-feed\.[a-z0-9-]+\.workers\.dev' deploy.log || true)"
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy printed no workers.dev URL for blueprint-evidence-feed."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify the live feed
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke.ts "$WORKER_URL" | tee -a "$GITHUB_STEP_SUMMARY"
