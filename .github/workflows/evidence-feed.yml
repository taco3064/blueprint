name: Evidence feed

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'workers/evidence-feed/**'
      - '.github/workflows/evidence-feed.yml'
  push:
    branches: [main]
    paths:
      - 'workers/evidence-feed/**'
      - '.github/workflows/evidence-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: workers/evidence-feed

jobs:
  bundle:
    name: Worker bundle
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    concurrency:
      group: evidence-feed-bundle-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: workers/evidence-feed/package-lock.json
      - run: npm ci
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy and verify
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
      || (github.event.action == 'labeled'
        && github.event.label.name == 'deploy-evidence-feed'
        && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: evidence-feed-production
      cancel-in-progress: false
    environment:
      name: evidence-feed
      url: ${{ steps.deploy.outputs.url && format('{0}/discussions', steps.deploy.outputs.url) || '' }}
    steps:
      - name: Require Cloudflare credentials
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (workers/evidence-feed/README.md, Activation), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: workers/evidence-feed/package-lock.json
      - run: npm ci
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -m 1 -oE 'https://blueprint-evidence-feed\.[a-z0-9-]+\.workers\.dev' deploy.log || true)"
          version="$(awk '/Current Version ID:/ { print $NF; exit }' deploy.log)"
          if [ -z "$url" ] || [ -z "$version" ]; then
            echo "::error::wrangler deploy printed no workers.dev URL or no Current Version ID for blueprint-evidence-feed."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Match the homepage to the deployed URL
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if ! grep -qF "'$WORKER_URL/discussions'" ../../docs/.vitepress/theme/evidence-feed.ts; then
            echo "::error::EVIDENCE_FEED_URL in docs/.vitepress/theme/evidence-feed.ts is not $WORKER_URL/discussions, so the homepage reads a different Worker."
            exit 1
          fi
      - name: Verify the live feed
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          WORKER_VERSION: ${{ steps.deploy.outputs.version }}
        run: node scripts/smoke.ts "$WORKER_URL" "$WORKER_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
